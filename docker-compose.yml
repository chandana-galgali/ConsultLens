# Optional: run the API + PostgreSQL (your submitted stack) with one command:  docker compose up --build
# The React frontend still runs with `npm run dev` (see START_HERE.md).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cl
      POSTGRES_PASSWORD: cl
      POSTGRES_DB: consultlens
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cl:cl@db:5432/consultlens
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    ports: ["8000:8000"]
    depends_on: [db]
    volumes: [uploads:/app/uploads]
volumes:
  pgdata: {}
  uploads: {}
